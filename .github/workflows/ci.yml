name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch or pull request makes the running checks
# pointless, so drop them. Never applied to the deploy workflow.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer install --no-progress
      - run: composer test
      - run: composer analyse
      - run: composer format

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Build release copy
        run: |
          mkdir -p build/ai-provider-for-amazee-ai
          rsync -a --exclude-from=.distignore --exclude build --exclude vendor ./ build/ai-provider-for-amazee-ai/
          composer install --no-dev --no-progress --working-dir=build/ai-provider-for-amazee-ai
          rm -f build/ai-provider-for-amazee-ai/composer.lock
      - uses: WordPress/plugin-check-action@v1
        with:
          build-dir: build/ai-provider-for-amazee-ai
      - uses: actions/upload-artifact@v7
        with:
          name: ai-provider-for-amazee-ai
          path: build/
