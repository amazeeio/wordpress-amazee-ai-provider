name: Deploy to WordPress.org

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer install --no-dev --no-progress
      - name: Deploy to WordPress.org SVN
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ai-provider-for-amazee-ai
      - name: Attach zip to GitHub release
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.deploy.outputs.zip-path }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Announce release in Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: C0917Q6J7RS
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          text="New plugin release: AI Provider for amazee.ai $VERSION - https://wordpress.org/plugins/ai-provider-for-amazee-ai/"
          response=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-type: application/json; charset=utf-8' \
            -d "$(jq -n --arg channel "$SLACK_CHANNEL" --arg text "$text" '{channel: $channel, text: $text}')")
          # chat.postMessage answers 200 even when it refuses, so the ok flag is the real status.
          echo "$response" | jq -e '.ok' >/dev/null || { echo "Slack rejected the message: $response"; exit 1; }
